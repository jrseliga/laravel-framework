[php]

; Put your php.ini directives here. For the latest default php.ini file, see https://github.com/php/php-src/blob/master/php.ini-production

memory_limit = "${PHP_MEMORY_LIMIT}"

short_open_tag = Off

xdebug.mode = "${XDEBUG_MODE}"
xdebug.client_port = "${XDEBUG_PORT}"
xdebug.log_level = 0
xdebug.start_with_request = yes

opcache.enable=1
opcache.enable_cli=1
opcache.file_cache=/tmp
opcache.file_cache_only=1
opcache.file_cache_consistency_checks=0
opcache.preload_user = jutin
opcache.preload = /tmp/laravel/preload.php
